<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ng-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2531" />
      <stop offset="1" stop-color="#04121a" />
    </linearGradient>
    <radialGradient id="ng-halo" cx="0.5" cy="0.47" r="0.55">
      <stop offset="0" stop-color="#1cc5e8" stop-opacity="0.42" />
      <stop offset="1" stop-color="#1cc5e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ng-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19c2e6" />
      <stop offset="1" stop-color="#54b6f7" />
    </linearGradient>
    <radialGradient id="ng-node" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d6f7ff" />
      <stop offset="0.45" stop-color="#42cdf2" />
      <stop offset="1" stop-color="#1aa6d8" />
    </radialGradient>
    <radialGradient id="ng-hub" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.4" stop-color="#9fe9ff" />
      <stop offset="1" stop-color="#1cc5e8" />
    </radialGradient>
    <filter id="ng-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#ng-bg)" />
  <circle cx="256" cy="246" r="186" fill="url(#ng-halo)" />

  <g transform="translate(8,4) scale(1.06) translate(-15,-14)">
    <!-- Luminous underlay -->
    <g filter="url(#ng-glow)" opacity="0.55">
      <path d="M120 256 L176 256 L196 200 L216 326 L238 256 L286 256" fill="none" stroke="#1cc5e8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M286 256 L364 178 L444 234 L444 302 L364 334 Z" fill="none" stroke="#1cc5e8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Graph edges -->
    <path d="M286 256 L364 178 L444 234 L444 302 L364 334 Z" fill="none" stroke="url(#ng-stroke)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse / heartbeat lead-in -->
    <path d="M120 256 L176 256 L196 200 L216 326 L238 256 L286 256" fill="none" stroke="url(#ng-stroke)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Nodes -->
    <circle cx="364" cy="178" r="24" fill="url(#ng-node)" />
    <circle cx="444" cy="234" r="21" fill="url(#ng-node)" />
    <circle cx="444" cy="302" r="21" fill="url(#ng-node)" />
    <circle cx="364" cy="334" r="24" fill="url(#ng-node)" />
    <!-- Hub where the pulse meets the graph -->
    <circle cx="286" cy="256" r="32" fill="url(#ng-hub)" />
  </g>
</svg>
