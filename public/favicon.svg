<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .fg { fill: #0b1120; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #ffffff; }
    }
  </style>
  <!-- Lower facet (foreground, flips with system theme) -->
  <path d="M26 34 L22 60 L56 26 L38 26 Z" class="fg"/>
  <!-- Upper facet (teal, constant) -->
  <path d="M42 4 L8 34 L26 34 L38 26 Z" fill="#4ecdc4"/>
  <!-- Hairline edge for crispness at small sizes -->
  <path d="M42 4 L8 34 L26 34 L22 60 L56 26 L38 26 Z"
        fill="none" stroke="#4ecdc4" stroke-opacity="0.7" stroke-width="1.2" stroke-linejoin="miter"/>
</svg>
