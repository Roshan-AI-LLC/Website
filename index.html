<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Roshan AI: Building intelligent systems that matter.</title>
    <meta
      name="description"
      content="Roshan AI builds production AI applications focused on accessibility and real-world impact. Featuring ShifaMind, interpretable clinical AI for healthcare."
    />
    <meta property="og:title" content="Roshan AI: Building intelligent systems that matter." />
    <meta
      property="og:description"
      content="Production AI for the real world. Featuring ShifaMind, our interpretable clinical AI."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/fonts/Inter/Inter-VariableFont_opsz,wght.ttf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/fonts/Tomorrow/Tomorrow-SemiBold.ttf"
      crossorigin
    />
    <script>
      // Inline pre-paint theme to avoid FOUC
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
