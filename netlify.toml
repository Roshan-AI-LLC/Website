[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# HTML documents must always revalidate. Otherwise a browser or CDN can serve
# a stale shell that references hashed JS/CSS from an earlier deploy; those
# files no longer exist, hydration never runs, and scroll-reveal sections stay
# invisible until a hard refresh. The more specific /assets/* rule below
# overrides this to keep hashed assets immutable.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Force correct content-types and short cache for crawl-critical files so
# Cloudflare/CDN proxies can't serve stale versions or the wrong mimetype
# (Lighthouse reports "unable to download robots.txt" if it gets text/html).
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Parent paths without a dedicated page send users somewhere useful.
[[redirects]]
  from = "/company"
  to = "/company/about"
  status = 301

[[redirects]]
  from = "/legal"
  to = "/legal/privacy"
  status = 301

# vite-react-ssg's static-loader-data-manifest must always resolve from root,
# even when fetched via a relative URL from a nested route. Without this
# rewrite, the SPA catchall below would serve index.html (HTML) in response
# to a manifest request, breaking JSON parsing on every non-root page.
[[redirects]]
  from = "/*/static-loader-data-manifest-:hash.json"
  to = "/static-loader-data-manifest-:hash.json"
  status = 200

# Any other missing .json must 404, never the SPA shell — otherwise client
# fetches that hit a missing file get HTML back and fail to JSON.parse.
[[redirects]]
  from = "/*.json"
  to = "/404"
  status = 404

# SSG produces real HTML per route. For any unmatched URL, fall back to the
# client-rendered 404 page (the React Router catch-all renders NotFound).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
